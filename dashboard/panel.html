<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control Panel</title>
<script src="data/attention.js"></script>
<script src="data/decisions.js"></script>
<script src="data/automation.js"></script>
<script src="data/headroom.js"></script>
<script src="data/attention.error.js"></script>
<script src="data/decisions.error.js"></script>
<script src="data/automation.error.js"></script>
<script src="data/headroom.error.js"></script>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --card-2: #fafbfc; --fg: #171a21; --muted: #68707e;
  --faint: #98a0ad; --border: #e2e5ea; --border-soft: #eceef2;
  --accent: #3b5bdb; --accent-soft: #eef1fd; --accent-fg: #3451c6;
  --green: #0f8a5f; --green-soft: #e5f5ee;
  --red: #bd353f; --red-soft: #fdeaea;
  --amber: #b06a00; --amber-soft: #fdf3e2;
  --shadow: 0 1px 2px rgba(16, 20, 28, .05), 0 4px 14px rgba(16, 20, 28, .06);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
html[data-theme="dark"] {
  --bg: #101215; --card: #191c21; --card-2: #1e2127; --fg: #eceef2; --muted: #a2aab8;
  --faint: #6d7482; --border: #2a2e36; --border-soft: #23262d;
  --accent: #8b9dff; --accent-soft: #20263f; --accent-fg: #a5b2ff;
  --green: #3fc794; --green-soft: #16302a;
  --red: #f0767c; --red-soft: #3a1d20;
  --amber: #e8b04b; --amber-soft: #38290f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column; min-height: 100vh;
}

/* ── Header ─────────────────────────────────────────────── */
.topbar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px 11px;
  background: var(--bg);
  border-bottom: 1px solid var(--border-soft);
}
.mark {
  width: 30px; height: 30px; border-radius: 8px; flex: none;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--accent), #7048e8);
  color: #fff; font-size: 11px; font-weight: 800; letter-spacing: .04em;
  box-shadow: var(--shadow);
}
.titles { min-width: 0; flex: 1; }
h1 { font-size: 14.5px; margin: 0; font-weight: 700; letter-spacing: -.01em; }
.sub {
  color: var(--muted); font-size: 11px; margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pill {
  flex: none; display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-weight: 650; padding: 4px 9px; border-radius: 999px;
  border: 1px solid transparent;
}
.pill .pdot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ok   { color: var(--green); background: var(--green-soft); border-color: transparent; }
.pill.warn { color: var(--amber); background: var(--amber-soft); }
.pill.bad  { color: var(--red);   background: var(--red-soft); }

/* ── Stat strip ─────────────────────────────────────────── */
.stats {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
  padding: 12px 16px 4px;
}
.stat {
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: 10px; padding: 8px 10px 7px; box-shadow: var(--shadow);
}
.stat .num { font-size: 17px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.stat .num.ok   { color: var(--green); }
.stat .num.warn { color: var(--amber); }
.stat .num.bad  { color: var(--red); }
.stat .lbl { color: var(--muted); font-size: 10.5px; margin-top: 1px; }

/* ── Section label ──────────────────────────────────────── */
.section-head {
  display: flex; align-items: baseline; justify-content: space-between;
  padding: 14px 18px 6px;
  color: var(--faint); font-size: 10.5px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
}
.section-head .count { color: var(--muted); font-weight: 600; letter-spacing: 0; text-transform: none; }

/* ── Item cards ─────────────────────────────────────────── */
#list { padding: 0 16px 12px; flex: 1; }
.item {
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: 12px; padding: 11px 12px 10px; margin-bottom: 8px;
  box-shadow: var(--shadow);
}
.item-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.badge {
  font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
  padding: 2.5px 7px; border-radius: 6px;
  color: var(--muted); background: var(--card-2); border: 1px solid var(--border-soft);
}
.badge.decision { color: var(--accent-fg); background: var(--accent-soft); border-color: transparent; }
.sev { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 10.5px; font-weight: 650; }
.sev i { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
.sev.s1 { color: var(--red); }   .sev.s1 i { background: var(--red); }
.sev.s2 { color: var(--amber); } .sev.s2 i { background: var(--amber); }
.sev.s3 { color: var(--faint); } .sev.s3 i { background: var(--faint); }
.q {
  font-size: 13.5px; font-weight: 650; letter-spacing: -.01em; margin-bottom: 3px;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.why {
  color: var(--muted); font-size: 12px; margin-bottom: 2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}

.opts { display: flex; flex-direction: column; gap: 5px; margin-top: 9px; }
.opt {
  display: flex; align-items: center; gap: 8px; width: 100%;
  border: 1px solid var(--border); background: var(--card-2); color: var(--fg);
  border-radius: 9px; padding: 7px 9px; cursor: pointer;
  font: inherit; font-size: 12.5px; text-align: left;
  transition: border-color .12s ease, background .12s ease;
}
.opt:hover { border-color: var(--accent); background: var(--accent-soft); }
.opt .key {
  flex: none; width: 18px; height: 18px; border-radius: 5px;
  display: inline-flex; align-items: center; justify-content: center;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--muted); font-size: 10.5px; font-weight: 700;
}
.opt .opt-label { flex: 1; min-width: 0; }
.opt .tag {
  flex: none; font-size: 9.5px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase;
  color: var(--accent-fg); background: var(--accent-soft);
  padding: 2px 6px; border-radius: 5px;
}
.opt.suggested { border-color: var(--accent); background: var(--accent-soft); }
.opt.ghost { justify-content: center; color: var(--muted); font-size: 12px; }
.opt.ghost:hover { color: var(--accent-fg); }
.meta { color: var(--faint); font-size: 11px; margin-top: 8px; }
.more { color: var(--muted); font-size: 11.5px; text-align: center; padding: 4px 0 2px; }

/* ── Empty state ────────────────────────────────────────── */
.empty { text-align: center; padding: 30px 20px 26px; }
.empty .ring {
  width: 44px; height: 44px; margin: 0 auto 10px; border-radius: 50%;
  background: var(--green-soft); color: var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 700;
}
.empty .t { font-size: 14px; font-weight: 700; }
.empty .s { color: var(--muted); font-size: 12px; margin-top: 2px; }

/* ── AI Headroom ────────────────────────────────────────── */
:root {
  --hr-green: #0f8a5f; --hr-yellow: #c99a06; --hr-orange: #d97706; --hr-red: #bd353f;
  --hr-cash: #3b5bdb;
}
html[data-theme="dark"] {
  --hr-green: #3fc794; --hr-yellow: #e3c04b; --hr-orange: #f0a35e; --hr-red: #f0767c;
  --hr-cash: #8b9dff;
}
.hr-head { display: flex; align-items: center; gap: 6px; padding: 14px 18px 6px; }
.hr-head .t {
  color: var(--faint); font-size: 10.5px; font-weight: 700;
  letter-spacing: .08em; text-transform: uppercase;
}
.hr-tabs {
  display: flex; gap: 2px; margin-left: auto;
  background: var(--card-2); border: 1px solid var(--border-soft);
  border-radius: 7px; padding: 2px;
}
.hr-tab {
  border: 0; background: transparent; color: var(--muted);
  font: inherit; font-size: 10.5px; font-weight: 650;
  padding: 2.5px 7px; border-radius: 5px; cursor: pointer;
}
.hr-tab.on { background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
.hr-pin {
  border: 0; background: transparent; color: var(--muted); cursor: pointer;
  font-size: 13px; padding: 2px 5px; border-radius: 5px;
}
.hr-pin:hover { color: var(--accent-fg); background: var(--accent-soft); }
.hr-pin.off { opacity: .35; }
#hr-list { padding: 0 16px 4px; }
.hr-row {
  background: var(--card); border: 1px solid var(--border-soft);
  border-radius: 11px; padding: 8px 10px; margin-bottom: 5px;
  box-shadow: var(--shadow); cursor: pointer;
}
.hr-row.stale { border-style: dashed; }
.hr-wline { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
.hr-wline.stale { opacity: .75; }
.hr-wname { color: var(--muted); font-size: 10.5px; min-width: 74px; }
.hr-wbarwrap { position: relative; flex: 1; height: 11px; }
.hr-wbarwrap .hr-track { bottom: 2px; height: 5px; }
.hr-wval { font-size: 11.5px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.hr-wcd { color: var(--faint); font-size: 9.5px; white-space: nowrap; }
.hr-note-line { color: var(--muted); font-size: 10.5px; margin-top: 4px; }
.hr-top { display: flex; align-items: baseline; gap: 6px; }
.hr-name { font-size: 12.5px; font-weight: 700; letter-spacing: -.01em; }
.hr-win { color: var(--muted); font-size: 10.5px; }
.hr-flag {
  font-size: 9px; font-weight: 750; letter-spacing: .05em; text-transform: uppercase;
  padding: 1.5px 5px; border-radius: 5px;
}
.hr-flag.stale { color: var(--amber); background: var(--amber-soft); }
.hr-flag.down { color: var(--red); background: var(--red-soft); }
.hr-flag.auth { color: var(--muted); background: var(--card-2); border: 1px solid var(--border-soft); }
.hr-flag.live { color: var(--green); background: var(--green-soft); }
.hr-val {
  margin-left: auto; font-size: 14.5px; font-weight: 750;
  font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.hr-val .unit { font-size: 10px; font-weight: 650; color: var(--muted); margin-left: 2px; }
.hr-barwrap { position: relative; height: 17px; margin-top: 4px; }
.hr-track {
  position: absolute; left: 0; right: 0; bottom: 3px; height: 6px;
  border-radius: 3px; background: var(--border-soft); overflow: hidden;
}
.hr-fill { height: 100%; border-radius: 3px; transition: width .6s ease; }
.hr-fill.cash { opacity: .3; }
.hr-fill.pulse { animation: hr-pulse 1.6s ease-in-out infinite; }
@keyframes hr-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
.hr-bricks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hr-sub { display: flex; align-items: baseline; gap: 8px; margin-top: 3px; color: var(--faint); font-size: 10.5px; }
.hr-sub .sp { flex: 1; }
.hr-pace { font-weight: 650; }
.hr-pace.unusual { color: var(--red); }
.hr-pace.fast { color: var(--amber); }
.hr-detail {
  display: none; margin-top: 7px; padding-top: 7px;
  border-top: 1px solid var(--border-soft); font-size: 11px; color: var(--muted);
}
.hr-row.open .hr-detail { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
.hr-detail b { color: var(--fg); font-weight: 650; }
.hr-note { padding: 2px 16px 8px; color: var(--faint); font-size: 11px; text-align: center; }
body.pin .topbar, body.pin .stats, body.pin .section-head,
body.pin #list, body.pin .toolbar { display: none; }
body.pin .hr-head { padding-top: 10px; }
@media (prefers-reduced-motion: reduce) {
  .hr-fill { transition: none; }
  .hr-fill.pulse { animation: none; }
}

/* ── Footer ─────────────────────────────────────────────── */
.toolbar {
  position: sticky; bottom: 0; z-index: 5;
  display: flex; align-items: center; gap: 6px;
  padding: 9px 12px;
  background: var(--bg); border-top: 1px solid var(--border-soft);
}
.tbtn {
  border: 1px solid var(--border); background: var(--card); color: var(--muted);
  border-radius: 8px; padding: 5px 10px; cursor: pointer;
  font: inherit; font-size: 12px; font-weight: 600;
  transition: color .12s ease, border-color .12s ease;
}
.tbtn:hover { color: var(--accent-fg); border-color: var(--accent); }
.tbtn.icon { padding: 5px 8px; }
.spacer { flex: 1; }
.tbtn.primary {
  border-color: transparent; background: var(--accent); color: #fff;
}
.tbtn.primary:hover { filter: brightness(1.08); color: #fff; }
</style>
</head>
<body>
<header class="topbar">
  <span class="mark">MC</span>
  <div class="titles">
    <h1>Mission Control</h1>
    <div class="sub" id="updated">Loading…</div>
  </div>
  <span class="pill ok" id="status-pill"><span class="pdot"></span><span id="status-text">Checking</span></span>
</header>

<section class="stats" id="stats" style="grid-template-columns: repeat(4, 1fr);">
  <div class="stat"><div class="num" id="stat-needs">–</div><div class="lbl">Needs you</div></div>
  <div class="stat"><div class="num" id="stat-jobs">–</div><div class="lbl" id="stat-jobs-lbl">Jobs healthy</div></div>
  <div class="stat"><div class="num" id="stat-feeds">–</div><div class="lbl">Feed age</div></div>
  <div class="stat"><div class="num" id="stat-ai">–</div><div class="lbl">AI headroom</div></div>
</section>

<div class="hr-head">
  <span class="t">AI Headroom</span>
  <div class="hr-tabs" id="hr-tabs"></div>
  <button class="hr-pin" type="button" id="hr-motion" title="Toggle burn animation">≋</button>
  <button class="hr-pin" type="button" id="hr-pin" title="Pin as always-on-top corner card">⇱</button>
</div>
<div id="hr-list"></div>

<div class="section-head"><span>Needs you</span><span class="count" id="needs-count"></span></div>
<div id="list"></div>

<footer class="toolbar">
  <button class="tbtn" type="button" id="refresh">↻ Refresh</button>
  <button class="tbtn icon" type="button" id="theme" title="Toggle dark mode">◐</button>
  <span class="spacer"></span>
  <button class="tbtn primary" type="button" id="open-full">Open Mission Control →</button>
</footer>

<script>
(function () {
  function theme() {
    try { return localStorage.getItem("mc-theme") || "light"; } catch (e) { return "light"; }
  }
  function applyTheme(t) {
    t = t === "dark" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("mc-theme", t); } catch (e) {}
    document.getElementById("theme").textContent = t === "dark" ? "◑" : "◐";
  }
  applyTheme(theme());
  document.getElementById("theme").onclick = function () {
    applyTheme(theme() === "dark" ? "light" : "dark");
  };
  document.getElementById("refresh").onclick = function () { location.reload(); };
  document.getElementById("open-full").onclick = function () {
    if (window.webkit && window.webkit.messageHandlers &&
        window.webkit.messageHandlers.mcOpenFull) {
      window.webkit.messageHandlers.mcOpenFull.postMessage({});
      return;
    }
    // Browser fallback when not inside mc-panel WKWebView.
    try { location.href = "index.html"; } catch (e) {}
  };

  function parseOptions(text) {
    var raw = String(text || ""), opts = [], suggested = null, m, firstChoice = -1;
    var tick = /\*\*`([^`]+)`\*\*/g;
    while ((m = tick.exec(raw)) && opts.length < 3) {
      if (firstChoice < 0) firstChoice = m.index;
      opts.push(m[1].trim());
    }
    if (!opts.length) {
      var bold = /\*\*([^*]{2,80})\*\*/g;
      while ((m = bold.exec(raw)) && opts.length < 3) {
        var label = m[1].replace(/^`|`$/g, "").trim();
        if (/DECISION NEEDED|Confirmed|recommend/i.test(label)) continue;
        if (firstChoice < 0) firstChoice = m.index;
        opts.push(label);
      }
    }
    if (/recommend(?:ed)?(?:\s+the)?\s+(?:first|1st|option\s*1)/i.test(raw) && opts.length) suggested = 1;
    else if (/Recommended/i.test(raw) && opts.length) suggested = 1;
    var questionRaw = firstChoice >= 0 ? raw.slice(0, firstChoice) : raw;
    var q = questionRaw.replace(/^\s*\*\*DECISION NEEDED:\*\*\s*/i, "")
      .replace(/\*\*|`/g, " ").replace(/\s+/g, " ").trim();
    if (q.length > 140) q = q.slice(0, 137) + "…";
    return { q: q || "Decision needs your answer", opts: opts, suggested: suggested };
  }

  function feeds() {
    return (window.MC && window.MC.feeds) || {};
  }
  function clipboardWrite(text) {
    try {
      if (typeof window.MC_CLIPBOARD_WRITE === "function") {
        return Promise.resolve().then(function () { return window.MC_CLIPBOARD_WRITE(text); });
      }
      if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") {
        return Promise.reject(new Error("clipboard unavailable"));
      }
      return Promise.resolve(navigator.clipboard.writeText(text));
    } catch (error) {
      return Promise.reject(error);
    }
  }

  function attentionFresh(attn) {
    if (!attn || !attn.ok || attn.data == null) return false;
    if (window.MC && window.MC.feedErrors && window.MC.feedErrors.attention) return false;
    var epoch = attn.generated_epoch;
    if (typeof epoch !== "number" || !isFinite(epoch) || epoch <= 0) return true;
    var age = (Date.now() / 1000) - epoch;
    // Stale after ~3x cadence (300s) — fall back to decisions so the panel never blanks.
    return age < 900;
  }

  function el(tag, className, text) {
    var n = document.createElement(tag);
    if (className) n.className = className;
    if (text != null) n.textContent = text;
    return n;
  }
  function sevChip(severity) {
    var s = +severity || 2;
    var label = s === 1 ? "High" : s === 3 ? "Low" : "Med";
    var chip = el("span", "sev s" + (s === 1 ? 1 : s === 3 ? 3 : 2));
    chip.appendChild(el("i"));
    chip.appendChild(document.createTextNode(label));
    return chip;
  }
  function fmtAge(epoch) {
    if (typeof epoch !== "number" || !isFinite(epoch) || epoch <= 0) return null;
    var s = Math.max(0, Math.round(Date.now() / 1000 - epoch));
    if (s < 60) return s + "s";
    if (s < 3600) return Math.round(s / 60) + "m";
    if (s < 86400) return Math.round(s / 3600) + "h";
    return Math.round(s / 86400) + "d";
  }
  function feedEpoch(f, name) {
    var feed = f[name] || {};
    var e = feed.generated_epoch;
    return (typeof e === "number" && isFinite(e) && e > 0) ? e : null;
  }

  function renderDecisionItem(list, d, i) {
    var parsed = (Array.isArray(d.options) && (d.question || d.title)) ? {
      q: d.question || d.title,
      opts: d.options.slice(0, 3),
      suggested: d.recommended == null ? null : +d.recommended
    } : parseOptions(d.text || d.title || "");
    var item = el("div", "item");
    var head = el("div", "item-head");
    head.appendChild(el("span", "badge decision", "Decision"));
    if (d.dupCount > 1) head.appendChild(el("span", "badge", "asked in " + d.dupCount + " chats"));
    head.appendChild(sevChip(1));
    item.appendChild(head);
    var qd = el("div", "q", parsed.q);
    qd.title = parsed.q;
    item.appendChild(qd);
    if (parsed.opts.length && d.id && /^decision:[0-9a-f]{24}$/.test(String(d.id))) {
      var row = el("div", "opts");
      parsed.opts.forEach(function (label, oi) {
        var n = oi + 1;
        var btn = el("button", "opt" + (parsed.suggested === n ? " suggested" : ""));
        btn.type = "button";
        btn.title = "Record choice " + n + " (or copies: dashboard decide answer " + d.id + " " + n + ")";
        btn.appendChild(el("span", "key", String(n)));
        btn.appendChild(el("span", "opt-label", label));
        if (parsed.suggested === n) btn.appendChild(el("span", "tag", "Suggested"));
        btn.onclick = function () {
          var cmd = "dashboard decide answer " + d.id + " " + n;
          if (window.webkit && window.webkit.messageHandlers &&
              window.webkit.messageHandlers.mcDecide) {
            var lbl = btn.querySelector(".opt-label");
            if (lbl) lbl.textContent = "Recording…";
            window.webkit.messageHandlers.mcDecide.postMessage({ id: d.id, n: n });
            setTimeout(function () { if (lbl) lbl.textContent = label; }, 1600);
            return;
          }
          var old = btn.querySelector(".opt-label");
          var oldText = old ? old.textContent : "";
          btn.disabled = true;
          clipboardWrite(cmd).then(function () {
            if (old) old.textContent = "Copied command";
          }, function () {
            if (old) old.textContent = "Copy failed — select command";
          }).then(function () {
            setTimeout(function () { if (old) old.textContent = oldText; btn.disabled = false; }, 1600);
          });
        };
        row.appendChild(btn);
      });
      item.appendChild(row);
    }
    var metaBits = [];
    if (d.provenance) metaBits.push(String(d.provenance));
    if (d.trust) metaBits.push(String(d.trust) + " trust");
    if (metaBits.length) item.appendChild(el("div", "meta", metaBits.join(" · ")));
    list.appendChild(item);
  }

  function renderAttentionItem(list, d, i) {
    var kind = d.kind || "manual";
    if (kind === "decision") {
      renderDecisionItem(list, d, i);
      return;
    }
    var item = el("div", "item");
    var head = el("div", "item-head");
    head.appendChild(el("span", "badge", kind.charAt(0).toUpperCase() + kind.slice(1)));
    if (d.dupCount > 1) head.appendChild(el("span", "badge", "asked in " + d.dupCount + " chats"));
    head.appendChild(sevChip(d.severity));
    item.appendChild(head);
    var qa = el("div", "q", d.title || "Needs attention");
    qa.title = d.title || "";
    item.appendChild(qa);
    if (d.why) item.appendChild(el("div", "why", d.why));
    if (d.id) {
      var row = el("div", "opts");
      var btn = el("button", "opt ghost", null);
      btn.type = "button";
      var cmd = "dashboard attention resolve " + d.id;
      btn.title = cmd;
      btn.appendChild(el("span", "opt-label", "Copy resolve command"));
      btn.onclick = function () {
        var lbl = btn.querySelector(".opt-label");
        var old = lbl ? lbl.textContent : "";
        btn.disabled = true;
        clipboardWrite(cmd).then(function () {
          if (lbl) lbl.textContent = "Copied command";
        }, function () {
          if (lbl) lbl.textContent = "Copy failed — select command";
        }).then(function () {
          setTimeout(function () { if (lbl) lbl.textContent = old; btn.disabled = false; }, 1600);
        });
      };
      row.appendChild(btn);
      item.appendChild(row);
    }
    var metaBits = [];
    if (d.due) metaBits.push("due " + d.due);
    if (d.source) metaBits.push(String(d.source));
    if (metaBits.length) item.appendChild(el("div", "meta", metaBits.join(" · ")));
    list.appendChild(item);
  }

  function renderEmpty(list) {
    var box = el("div", "empty");
    box.appendChild(el("div", "ring", "✓"));
    box.appendChild(el("div", "t", "All clear"));
    box.appendChild(el("div", "s", "Nothing is waiting on you right now."));
    list.appendChild(box);
  }

  function renderFromDecisions(list) {
    var f = feeds();
    var dec = f.decisions || {};
    var pinned = ((dec.data || {}).pinned) || [];
    if (!pinned.length) {
      renderEmpty(list);
      return 0;
    }
    // The same question captured from several chats is ONE ask — show it once
    // with a count instead of three identical cards (seen live 2026-08-07).
    var seen = {}, deduped = [];
    pinned.forEach(function (d) {
      var key = String(d.question || d.title || d.id || "").replace(/\s+/g, " ").trim().toLowerCase().slice(0, 160);
      if (seen[key]) { seen[key].dupCount += 1; return; }
      seen[key] = d;
      d.dupCount = 1;
      deduped.push(d);
    });
    deduped.slice(0, 5).forEach(function (d, i) { renderDecisionItem(list, d, i); });
    if (deduped.length > 5) {
      list.appendChild(el("div", "more", "+" + (deduped.length - 5) + " more in full Mission Control"));
    }
    return deduped.length;
  }

  function render() {
    var f = feeds();
    var list = document.getElementById("list");
    list.textContent = "";
    var attn = f.attention || {};
    var needsTotal = 0;
    var usedAttention = false;
    if (attentionFresh(attn)) {
      var top5 = ((attn.data || {}).top5) || [];
      var board = ((attn.data || {}).board) || [];
      usedAttention = true;
      // The same ask captured from several chats is ONE card with a count,
      // not identical repeats (the triple Safe-Mode card, live 2026-08-07).
      var seenA = {}, dedupA = [];
      (board.length ? board : top5).forEach(function (d) {
        var key = String(d.question || d.title || d.text || d.id || "")
          .replace(/\s+/g, " ").trim().toLowerCase().slice(0, 200);
        if (seenA[key]) { seenA[key].dupCount += 1; return; }
        seenA[key] = d;
        d.dupCount = 1;
        dedupA.push(d);
      });
      var total = dedupA.length;
      if (dedupA.length) {
        dedupA.slice(0, 5).forEach(function (d, i) { renderAttentionItem(list, d, i); });
        if (total > 5) {
          list.appendChild(el("div", "more", "+" + (total - 5) + " more in full Mission Control"));
        }
      } else {
        renderEmpty(list);
      }
      needsTotal = total;
    } else {
      needsTotal = renderFromDecisions(list);
    }

    // Automation health + status pill.
    var jobs = ((f.automation || {}).data || {}).jobs || [];
    var red = jobs.filter(function (j) { return j.state === "red"; }).length;
    var yellow = jobs.filter(function (j) {
      return j.state === "yellow" || j.state === "degraded"; }).length;
    var healthy = jobs.length - red - yellow;

    var pill = document.getElementById("status-pill");
    var pillText = document.getElementById("status-text");
    if (red > 0) {
      pill.className = "pill bad";
      pillText.textContent = red + " red job" + (red > 1 ? "s" : "");
    } else if (needsTotal > 0 || yellow > 0) {
      pill.className = "pill warn";
      pillText.textContent = needsTotal > 0
        ? needsTotal + " need" + (needsTotal > 1 ? "" : "s") + " you"
        : yellow + " job warning" + (yellow > 1 ? "s" : "");
    } else {
      pill.className = "pill ok";
      pillText.textContent = "All clear";
    }

    // Stat strip.
    var needsEl = document.getElementById("stat-needs");
    needsEl.textContent = String(needsTotal);
    needsEl.className = "num" + (needsTotal > 0 ? " warn" : " ok");
    var jobsEl = document.getElementById("stat-jobs");
    jobsEl.textContent = jobs.length ? (healthy + "/" + jobs.length) : "–";
    jobsEl.className = "num" + (red > 0 ? " bad" : yellow > 0 ? " warn" : jobs.length ? " ok" : "");
    document.getElementById("stat-jobs-lbl").textContent =
      red > 0 ? (red + " red") : yellow > 0 ? (yellow + " warning") : "Jobs healthy";

    var epochs = [feedEpoch(f, "attention"), feedEpoch(f, "decisions"), feedEpoch(f, "automation")]
      .filter(function (e) { return e != null; });
    var newest = epochs.length ? Math.max.apply(null, epochs) : null;
    var age = newest ? fmtAge(newest) : null;
    var stale = newest ? (Date.now() / 1000 - newest) > 900 : true;
    var feedsEl = document.getElementById("stat-feeds");
    feedsEl.textContent = age || "–";
    feedsEl.className = "num" + (stale ? " warn" : " ok");
    document.getElementById("updated").textContent = age
      ? (stale ? "Feeds stale — updated " + age + " ago" : "Updated " + age + " ago")
      : "No feed data yet";
    document.getElementById("needs-count").textContent =
      needsTotal > 0 ? (needsTotal + " open") : "";
  }
  render();

  /* ── AI Headroom section ─────────────────────────────── */
  // Motion default is ON despite prefers-reduced-motion: the burn animation is
  // the explicitly requested core of this feature and this is a personal tool;
  // the header toggle (persisted) turns it off in one click.
  var HR = {
    view: (function () { try { return localStorage.getItem("mc-hr-view") || "active"; } catch (e) { return "active"; } })(),
    motion: (function () { try { return localStorage.getItem("mc-hr-motion") || "on"; } catch (e) { return "on"; } })(),
    anims: [], raf: null, lastT: 0
  };
  Object.defineProperty(HR, "reduced", { get: function () { return HR.motion !== "on"; } });
  var HR_VIEWS = [["active", "Active"], ["lowest", "Low"], ["5h", "5h"],
                  ["week", "Wk"], ["month", "Mo"], ["all", "All"]];
  var HR_BAND = { green: "--hr-green", yellow: "--hr-yellow", orange: "--hr-orange",
                  red: "--hr-red", cash: "--hr-cash", none: "--hr-cash" };

  if (/[?&]mode=pin/.test(location.search)) document.body.classList.add("pin");

  function hrColor(band) {
    return getComputedStyle(document.documentElement)
      .getPropertyValue(HR_BAND[band] || "--hr-cash").trim() || "#3b5bdb";
  }
  function hrFeed() { return feeds().headroom || null; }
  function hrCountdown(epoch, monthly) {
    if (typeof epoch !== "number" || !isFinite(epoch) || epoch <= 0) return null;
    var s = Math.round(epoch - Date.now() / 1000);
    if (s <= 0) return monthly ? "renewing…" : "resetting…";
    var d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
    var txt = d > 0 ? d + "d " + h + "h" : h > 0 ? h + "h " + m + "m" : m + "m";
    return (monthly ? "renews in " : "resets in ") + txt;
  }
  function hrSorted(rows) {
    var vis = rows.filter(function (r) { return r.health !== "hidden"; });
    var quota = vis.filter(function (r) { return r.kind === "quota" && r.remaining_pct != null; });
    var rest = vis.filter(function (r) { return !(r.kind === "quota" && r.remaining_pct != null); });
    quota.sort(function (a, b) { return a.remaining_pct - b.remaining_pct; });
    rest.sort(function (a, b) { return (a.runway_hours || 1e9) - (b.runway_hours || 1e9); });
    return quota.concat(rest);
  }
  function hrFilter(rows) {
    var sorted = hrSorted(rows), v = HR.view;
    if (v === "all") return { rows: sorted, note: null };
    if (v === "5h" || v === "week" || v === "month") {
      var f = sorted.filter(function (r) { return r.window_class === v; });
      return { rows: f, note: f.length ? null : "No " + (v === "5h" ? "5-hour" : v === "week" ? "weekly" : "monthly") + " windows right now." };
    }
    if (v === "lowest") return { rows: sorted, note: null };
    var act = sorted.filter(function (r) { return r.active; });
    if (act.length) return { rows: act, note: null };
    return { rows: sorted, note: "Nothing is running — showing lowest headroom instead." };
  }

  function hrValText(r) {
    if (r.value_label) return r.value_label;
    if (r.kind === "quota" && r.remaining_pct != null) return Math.round(r.remaining_pct) + "%";
    if (r.balance_usd != null) return "$" + Number(r.balance_usd).toFixed(2);
    return "\u2013";
  }
  function hrRowColor(r) {
    return hrColor(r.kind === "balance" ? (r.band === "cash" ? "cash" : r.band) : r.band);
  }
  function hrHeadlineRow(rows) {
    var quota = rows.filter(function (r) { return r.kind === "quota" && r.remaining_pct != null; });
    if (quota.length) return quota.reduce(function (a, b) { return a.remaining_pct <= b.remaining_pct ? a : b; });
    return rows[0];
  }
  function hrWindowLine(r, showName) {
    var line = el("div", "hr-wline" + (r.confidence === "stale" ? " stale" : ""));
    if (showName) line.appendChild(el("span", "hr-wname",
      (r.window_label && r.window_label !== "-") ? r.window_label : "Status"));
    var wrap = el("div", "hr-wbarwrap");
    var track = el("div", "hr-track");
    var fill = el("div", "hr-fill");
    var color = hrRowColor(r);
    fill.style.background = color;
    if (r.kind === "quota" && r.remaining_pct != null) {
      fill.style.width = Math.max(0, Math.min(100, r.remaining_pct)) + "%";
    } else {
      fill.style.width = "100%";
      if (r.band === "cash") fill.className += " cash";
    }
    if (r.active && !(r.burn_per_hour > 0) && !HR.reduced) fill.className += " pulse";
    track.appendChild(fill);
    wrap.appendChild(track);
    if (!HR.reduced) {
      var canvas = el("canvas", "hr-bricks");
      wrap.appendChild(canvas);
      HR.anims.push({ canvas: canvas, row: r, color: color, parts: [], acc: 0 });
    }
    line.appendChild(wrap);
    var right = el("span", "hr-wval", hrValText(r));
    right.style.color = color;
    line.appendChild(right);
    var cd = hrCountdown(r.resets_epoch, r.window_class === "month");
    if (cd) line.appendChild(el("span", "hr-wcd", cd.replace("resets in ", "").replace("renews in ", "")));
    return line;
  }
  function hrProviderCard(grp) {
    var rows = grp.rows;
    var head = hrHeadlineRow(rows);
    var anyStale = rows.some(function (r) { return r.confidence === "stale"; });
    var card = el("div", "hr-row hr-card" + (anyStale ? " stale" : ""));
    var top = el("div", "hr-top");
    top.appendChild(el("span", "hr-name", grp.label));
    if (rows.length === 1 && rows[0].window_label && rows[0].window_label !== "-") {
      top.appendChild(el("span", "hr-win", rows[0].window_label));
    }
    if (rows.some(function (r) { return r.active; })) top.appendChild(el("span", "hr-flag live", "In use"));
    if (anyStale) top.appendChild(el("span", "hr-flag stale", "Stale"));
    if (rows.some(function (r) { return r.health === "down"; })) top.appendChild(el("span", "hr-flag down", "Source down"));
    if (rows.some(function (r) { return r.health === "auth"; })) top.appendChild(el("span", "hr-flag auth", "Token wait"));
    var val = el("span", "hr-val", hrValText(head));
    val.style.color = hrRowColor(head);
    if (head.kind === "quota" && head.remaining_pct != null && !head.value_label) {
      val.appendChild(el("span", "unit", "left"));
    }
    top.appendChild(val);
    card.appendChild(top);
    rows.forEach(function (r) {
      if (r.remaining_pct != null || r.balance_usd != null || r.value_label) {
        card.appendChild(hrWindowLine(r, rows.length > 1));
      }
    });
    rows.forEach(function (r) {
      var le = (r.detail || {}).local_estimate;
      if (le && le.tokens_used != null) {
        card.appendChild(el("div", "hr-note-line",
          Number(le.tokens_used).toLocaleString() + " tokens this block" +
          (le.burn_tpm ? " \u00b7 " + Number(le.burn_tpm).toLocaleString() + " tok/min (local estimate)" : "")));
      } else if (r.health !== "ok" && r.note && !(r.remaining_pct != null || r.balance_usd != null || r.value_label)) {
        card.appendChild(el("div", "hr-note-line", r.note));
      }
    });
    var sub = el("div", "hr-sub");
    var ages = rows.map(function (r) { return r.age_s || 0; });
    var oldest = Math.max.apply(null, ages);
    if (oldest > 600) sub.appendChild(el("span", null, "updated " + (oldest < 3600 ? Math.round(oldest / 60) + "m" : Math.round(oldest / 3600) + "h") + " ago"));
    sub.appendChild(el("span", "sp"));
    if (head.burn_per_hour != null && head.burn_per_hour > 0) {
      sub.appendChild(el("span", null, (head.kind === "quota" ? head.burn_per_hour.toFixed(1) + "%/h" : "$" + head.burn_per_hour.toFixed(2) + "/h")));
    }
    if (head.pace === "unusual") sub.appendChild(el("span", "hr-pace unusual", "Unusually fast"));
    if (sub.children.length > 1) card.appendChild(sub);
    var det = el("div", "hr-detail");
    function drow(k, v) {
      if (v == null || v === "") return;
      det.appendChild(el("span", null, k));
      var b = el("b"); b.textContent = String(v); det.appendChild(b);
    }
    rows.forEach(function (r) {
      var prefix = rows.length > 1 && r.window_label && r.window_label !== "-" ? r.window_label + " \u2014 " : "";
      drow(prefix + "Source", r.source || "\u2013");
      if (r.note) drow(prefix + "Note", r.note);
      if (r.forecast_exhaust_epoch) {
        var hLeft = Math.max(0, (r.forecast_exhaust_epoch - Date.now() / 1000) / 3600);
        drow(prefix + "Forecast", "empty in ~" + hLeft.toFixed(1) + "h \u2014 before reset");
      }
      if (r.baseline_median != null) drow(prefix + "Normal burn", (r.kind === "quota" ? r.baseline_median + "%/h" : "$" + r.baseline_median + "/h"));
      if (r.runway_hours != null) drow(prefix + "Runway", (r.runway_hours / 24).toFixed(1) + " days at current burn");
      var d = r.detail || {};
      if (d.membership) drow(prefix + "Plan", d.membership);
      if (d.plan) drow(prefix + "Plan", d.plan + (d.tier ? " (tier " + d.tier + ")" : ""));
      if (d.included != null) drow(prefix + "Included", d.included + " + " + (d.bonus || 0) + " bonus");
      if (d.auto_pct_used != null) drow(prefix + "Auto models", d.auto_pct_used + "% used");
      if (d.project_cap != null) drow(prefix + "Monthly cap", Number(d.project_cap).toLocaleString() + " reads");
      if (d.voucher != null && d.voucher > 0) drow(prefix + "Voucher", "$" + d.voucher);
      if (d.granted != null && d.granted > 0) drow(prefix + "Granted", "$" + d.granted);
    });
    card.appendChild(det);
    card.onclick = function (e) {
      if (e.target.closest("button")) return;
      card.classList.toggle("open");
    };
    return card;
  }

  function hrTick(t) {
    HR.raf = null;
    var dt = Math.min(0.1, (t - (HR.lastT || t)) / 1000);
    HR.lastT = t;
    var alive = false;
    HR.anims.forEach(function (a) {
      var c = a.canvas, r = a.row;
      if (!c.isConnected) return;
      var dpr = window.devicePixelRatio || 1;
      var w = c.clientWidth, h = c.clientHeight;
      if (!w || !h) return;
      if (c.width !== w * dpr) { c.width = w * dpr; c.height = h * dpr; }
      var ctx = c.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      var burn = r.burn_per_hour;
      var rate = (r.active && burn > 0)
        ? Math.max(2, Math.min(14, r.kind === "quota" ? 2 + burn * 0.8 : 2 + burn * 4)) : 0;
      if (rate > 0) {
        a.acc += rate * dt;
        var edgeX = r.kind === "quota" ? (w * Math.max(0, Math.min(100, r.remaining_pct)) / 100) : w * 0.55;
        while (a.acc >= 1) {
          a.acc -= 1;
          a.parts.push({ x: edgeX, y: h - 6, vx: 22 + Math.random() * 34,
                         vy: -(16 + Math.random() * 26), life: 0.85 });
        }
      }
      a.parts = a.parts.filter(function (p) { return p.life > 0; });
      a.parts.forEach(function (p) {
        p.life -= dt; p.vy += 95 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
        ctx.globalAlpha = Math.max(0, p.life / 0.85) * 0.9;
        ctx.fillStyle = a.color;
        ctx.fillRect(p.x, p.y, 2.5, 2);
      });
      ctx.globalAlpha = 1;
      if (a.parts.length || rate > 0) alive = true;
    });
    if (alive && !document.hidden) HR.raf = requestAnimationFrame(hrTick);
  }
  function hrKick() {
    if (!HR.reduced && !HR.raf && HR.anims.length) HR.raf = requestAnimationFrame(hrTick);
  }

  function renderHeadroom() {
    var tabs = document.getElementById("hr-tabs");
    var list = document.getElementById("hr-list");
    if (!tabs || !list) return;
    tabs.textContent = "";
    HR_VIEWS.forEach(function (v) {
      var b = el("button", "hr-tab" + (HR.view === v[0] ? " on" : ""), v[1]);
      b.type = "button";
      b.onclick = function () {
        HR.view = v[0];
        try { localStorage.setItem("mc-hr-view", v[0]); } catch (e) {}
        renderHeadroom();
      };
      tabs.appendChild(b);
    });
    var motion = document.getElementById("hr-motion");
    motion.classList.toggle("off", HR.motion !== "on");
    motion.title = HR.motion === "on" ? "Burn animation on — click to turn off" : "Burn animation off — click to turn on";
    motion.onclick = function () {
      HR.motion = HR.motion === "on" ? "off" : "on";
      try { localStorage.setItem("mc-hr-motion", HR.motion); } catch (e) {}
      renderHeadroom();
    };
    var pin = document.getElementById("hr-pin");
    var inPanel = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.mcPin);
    pin.style.display = inPanel ? "" : "none";
    pin.onclick = function () { window.webkit.messageHandlers.mcPin.postMessage({}); };

    HR.anims = [];
    list.textContent = "";
    var feed = hrFeed();
    var statAi = document.getElementById("stat-ai");
    if (!feed || !feed.data || !Array.isArray(feed.data.rows)) {
      list.appendChild(el("div", "hr-note",
        "Headroom collector not running — scripts/install-ai-headroom in global-implementations sets it up."));
      if (statAi) { statAi.textContent = "–"; statAi.className = "num"; }
      return;
    }
    var res = hrFilter(feed.data.rows);
    if (!res.rows.length) {
      list.appendChild(el("div", "hr-note", res.note || "No usage rows."));
    } else {
      // ONE white card per provider; every window is a compact line inside it
      var groups = [], byProv = {};
      res.rows.forEach(function (r) {
        var key = r.provider || r.label || "?";
        var grp = byProv[key];
        if (!grp) { grp = { label: r.label || key, rows: [] }; byProv[key] = grp; groups.push(grp); }
        grp.rows.push(r);
      });
      groups.forEach(function (grp) { list.appendChild(hrProviderCard(grp)); });
      if (res.note) list.appendChild(el("div", "hr-note", res.note));
      if (HR.view === "all") {
        feed.data.rows.filter(function (r) { return r.health === "hidden"; }).forEach(function (r) {
          list.appendChild(el("div", "hr-note", r.label + ": " + (r.note || "not configured")));
        });
      }
    }
    var low = feed.data.summary && feed.data.summary.lowest_quota;
    if (statAi) {
      if (low && low.remaining_pct != null) {
        statAi.textContent = Math.round(low.remaining_pct) + "%";
        statAi.style.color = hrColor(low.band);
        statAi.className = "num";
        statAi.title = low.label + " " + low.window_label;
      } else {
        statAi.textContent = "–"; statAi.className = "num"; statAi.style.color = "";
      }
    }
    var age = Date.now() / 1000 - (feed.generated_epoch || 0);
    if (feed.generated_epoch && age > 300) {
      list.appendChild(el("div", "hr-note", "Collector data is " + Math.round(age / 60) + " min old."));
    }
    hrKick();
  }

  window.MC_updateHeadroom = function (feed) {
    if (!feed || typeof feed !== "object") return;
    window.MC = window.MC || { feeds: {} };
    window.MC.feeds = window.MC.feeds || {};
    window.MC.feeds.headroom = feed;
    renderHeadroom();
  };
  document.addEventListener("visibilitychange", hrKick);
  renderHeadroom();
})();
</script>
</body>
</html>
