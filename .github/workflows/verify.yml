name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install required ShellCheck
        run: brew install shellcheck

      - name: Install the pinned OpenSpec CLI
        run: npm install --global --ignore-scripts @fission-ai/openspec@1.5.0

      - name: Install the pinned Playwright test client
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.0

      - name: Verify vendored cytoscape matches the lockfile hash
        run: /usr/bin/shasum -a 256 -c dashboard/vendor/cytoscape.min.js.sha256

      - name: Run the authoritative verifier
        run: /bin/bash scripts/verify.sh
